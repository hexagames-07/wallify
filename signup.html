<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Wallify - Create Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#08080d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.box{
  width:100%;
  max-width:420px;
  background:#111118;
  border:1px solid #292932;
  border-radius:24px;
  padding:30px 24px;
}

.logo{
  text-align:center;
  font-size:40px;
  font-weight:800;
  margin-bottom:8px;
}

.logo span{
  color:#7c4dff;
}

.subtitle{
  text-align:center;
  color:#858590;
  margin-bottom:28px;
}

input{
  width:100%;
  height:54px;
  margin-bottom:14px;
  padding:0 18px;
  border-radius:14px;
  border:1px solid #363640;
  background:#181820;
  color:#fff;
  outline:none;
  font-size:16px;
}

input:focus{
  border-color:#7c4dff;
}

button{
  width:100%;
  height:52px;
  border:0;
  border-radius:14px;
  background:#7c4dff;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.login-link{
  margin-top:18px;
  text-align:center;
  color:#858590;
}

.login-link button{
  width:auto;
  height:auto;
  padding:0;
  background:none;
  color:#9b7aff;
}

.message{
  margin-top:15px;
  text-align:center;
  font-size:14px;
  min-height:20px;
}

</style>

</head>

<body>

<div class="box">

  <div class="logo">
    Wall<span>ify</span>
  </div>

  <div class="subtitle">
    Create your Wallify account
  </div>

  <input
    id="username"
    type="text"
    placeholder="Username"
    autocomplete="username"
    maxlength="30"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="new-password"
  >

  <input
    id="email"
    type="email"
    placeholder="Email (optional)"
    autocomplete="email"
  >

  <button
    id="createBtn"
    type="button"
  >
    Create Account
  </button>

  <div class="login-link">

    Already have an account?

    <button
      id="loginBtn"
      type="button"
    >
      Login
    </button>

  </div>

  <div
    id="message"
    class="message"
  ></div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://xmlvgdkpmukjwnmfipbr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_si1g8fi2va2k96oCp7_kHg_q6w6JnB-";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const usernameInput =
  document.getElementById(
    "username"
  );

const passwordInput =
  document.getElementById(
    "password"
  );

const emailInput =
  document.getElementById(
    "email"
  );

const createBtn =
  document.getElementById(
    "createBtn"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const message =
  document.getElementById(
    "message"
  );


/* =========================================
   CREATE ACCOUNT
========================================= */

createBtn.addEventListener(
  "click",
  async () => {

    const username =
      usernameInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;

    const email =
      emailInput.value
        .trim()
        .toLowerCase();


    /* Username */

    if(!username){

      message.textContent =
        "Username required.";

      return;

    }


    if(username.length < 3){

      message.textContent =
        "Username must be at least 3 characters.";

      return;

    }


    if(
      !/^[a-z0-9_.]+$/.test(
        username
      )
    ){

      message.textContent =
        "Use only letters, numbers, _ or .";

      return;

    }


    /* Password */

    if(!password){

      message.textContent =
        "Password required.";

      return;

    }


    if(password.length < 6){

      message.textContent =
        "Password must be at least 6 characters.";

      return;

    }


    createBtn.disabled =
      true;

    message.textContent =
      "Creating account...";


    try{

      /*
        Temporary internal login identifier.

        Username is still the public
        Wallify identity.
      */

      const authEmail =
        username +
        "@wallify.local";


      /*
        Check username first.
      */

      const existing =
        await supabaseClient
          .from("profiles")
          .select("id")
          .eq(
            "username",
            username
          )
          .maybeSingle();


      if(existing.error){

        console.error(
          existing.error
        );

        message.textContent =
          "Unable to check username.";

        createBtn.disabled =
          false;

        return;

      }


      if(existing.data){

        message.textContent =
          "This username is already taken.";

        createBtn.disabled =
          false;

        return;

      }


      /*
        Create Supabase Auth account.
      */

      const result =
        await supabaseClient
          .auth
          .signUp({
            email:authEmail,
            password:password,

            options:{
              data:{
                username:username
              }
            }
          });


      if(result.error){

        console.error(
          result.error
        );

        message.textContent =
          result.error.message;

        createBtn.disabled =
          false;

        return;

      }


      /*
        If session exists,
        go to Wallify.
      */

      if(result.data.session){

        message.textContent =
          "Account created successfully.";

        setTimeout(
          () => {

            window.location.href =
              "./index.html";

          },
          700
        );

        return;

      }


      /*
        Email confirmation may be
        enabled in Supabase.
      */

      message.textContent =
        "Account created. Please continue to login.";

      setTimeout(
        () => {

          window.location.href =
            "./login.html";

        },
        1500
      );


    }catch(error){

      console.error(
        error
      );

      message.textContent =
        "Something went wrong.";

    }


    createBtn.disabled =
      false;

  }
);


/* =========================================
   LOGIN
========================================= */

loginBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      "./login.html";

  }
);

</script>

</body>
</html>
